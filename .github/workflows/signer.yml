# The curator signer. Tests run on every pull request that touches signer/.
# A push publishes one line and never the others:
#
#   master             alpha-<full-sha>     prod (alpha). No latest, no version tag.
#   dev                <sha7>-dev and dev   integration.
#   demo               <sha7>-demo and demo the demo line, cut from the old main.
#
# workflow_dispatch from master or release/alpha-1 publishes alpha-<full-sha>.
# Dispatch from dev or demo publishes that line. No other ref publishes.
# main no longer publishes, so latest and the version tag stay where they are.
#
# Two repository secrets, the same names the backend workflow uses:
# DOCKER_USERNAME and DOCKER_PASSWORD (a Docker Hub access token with write
# on the repository). Nothing else here is secret.
name: signer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'signer/**'
      - '.github/workflows/signer.yml'
  push:
    branches: [master, dev, demo]
    paths:
      - 'signer/**'
      - '.github/workflows/signer.yml'

permissions:
  contents: read

env:
  IMAGE: intothefathom/curator-public

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: signer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: signer/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test

      # The image must build and its layout must resolve: importing the
      # signer's index inside the container reads the manifest and an IDL.
      - name: Build the image and import the signer inside it
        run: |
          docker build -t curator-public:ci .
          docker run --rm curator-public:ci node -e "import('/app/packages/curator/src/index.js').then((m) => { if (typeof m.boot !== 'function') throw new Error('no boot'); console.log('signer resolves'); })"

  publish:
    needs: test
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev' ||
         github.ref == 'refs/heads/demo' || github.ref == 'refs/heads/release/alpha-1'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Choose the line
        id: line
        run: |
          short=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
          case "$GITHUB_REF" in
            refs/heads/master|refs/heads/release/alpha-1)
              tags="$IMAGE:alpha-$GITHUB_SHA"
              ;;
            refs/heads/dev)
              tags="$IMAGE:${short}-dev"$'\n'"$IMAGE:dev"
              ;;
            refs/heads/demo)
              tags="$IMAGE:${short}-demo"$'\n'"$IMAGE:demo"
              ;;
            *)
              echo "::error::refusing to publish $GITHUB_REF"
              exit 1
              ;;
          esac
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: signer
          push: true
          tags: ${{ steps.line.outputs.tags }}

      - name: Image summary
        env:
          TAGS: ${{ steps.line.outputs.tags }}
        run: |
          {
            echo "## Signer image published"
            echo
            echo "$TAGS" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
